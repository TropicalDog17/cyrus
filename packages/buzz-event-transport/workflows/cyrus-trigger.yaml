# Canonical buzz-workflow definition that drives Cyrus ingress.
#
# Install with:
#   buzz workflows create --channel <CHANNEL_UUID> --yaml - < cyrus-trigger.yaml
#
# This file is the other half of `src/types.ts`: buzz-workflow lets the author
# choose the request body, so the shape BuzzEventTransport parses is defined
# here and nowhere upstream. Keep the two in lockstep.
#
# WHY THE BODY CARRIES NO MESSAGE TEXT
# ------------------------------------
# buzz-workflow's `resolve_template` substitutes `{{trigger.*}}` by raw string
# concatenation with no JSON escaping. Interpolating `{{trigger.text}}` into a
# JSON body produces invalid JSON as soon as somebody types a double quote, a
# backslash or a newline — i.e. constantly. Every field below is therefore
# id-shaped (64-hex, a UUID, a unix timestamp) and JSON-safe by construction;
# Cyrus reads the message text back from the relay by event id.
#
# The Authorization header must match `buzz.webhookSecret` in ~/.cyrus/config.json.
# buzz-workflow refuses non-public and non-HTTPS targets and does not follow
# redirects, so CYRUS_BASE_URL has to be the real public tunnel URL.

name: cyrus-trigger
description: Forward Buzz channel activity to Cyrus

trigger:
  on: message_posted

steps:
  - id: notify-cyrus
    name: POST the trigger to Cyrus
    action: call_webhook
    url: https://REPLACE_WITH_CYRUS_PUBLIC_URL/buzz-webhook
    method: POST
    headers:
      Content-Type: application/json
      Authorization: Bearer REPLACE_WITH_BUZZ_WEBHOOK_SECRET
    body: >-
      {"type":"message_posted",
      "message_id":"{{trigger.message_id}}",
      "channel_id":"{{trigger.channel_id}}",
      "author":"{{trigger.author}}",
      "timestamp":"{{trigger.timestamp}}"}
